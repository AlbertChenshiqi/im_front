<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>IM 测试</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="wx-app" id="app">
      <!-- 左侧：会话列表 -->
      <aside class="wx-sidebar" id="sidebar">
        <header class="wx-sidebar-head">
          <div class="wx-me">
            <div class="wx-me-avatar" id="meAvatar">?</div>
            <div class="wx-me-info">
              <span class="wx-me-name" id="currentUser">未登录</span>
              <span class="wx-me-id" id="meUserIdHint">user_id: 1</span>
            </div>
          </div>
          <div class="wx-sidebar-actions">
            <button type="button" class="icon-btn" id="btnRefreshConv" title="刷新会话">↻</button>
            <button type="button" class="icon-btn" id="btnOpenSettings" title="设置">⚙</button>
          </div>
        </header>
        <div class="wx-search">
          <input type="search" id="convSearch" placeholder="搜索会话" />
        </div>
        <div class="wx-conv-list" id="convList"></div>
        <div class="wx-sidebar-foot">
          <button type="button" class="foot-btn" id="btnQuickGroup1">种子群</button>
          <button type="button" class="foot-btn" id="btnQuickC2c2">私信 2</button>
          <button type="button" class="foot-btn" id="btnQuickC2c3">私信 3</button>
        </div>
      </aside>

      <!-- 右侧：聊天区 -->
      <main class="wx-chat" id="chatMain">
        <header class="wx-chat-head">
          <button type="button" class="icon-btn mobile-only" id="btnBackList" aria-label="返回">‹</button>
          <div class="wx-chat-titles">
            <h1 id="chatTitle">IM 测试</h1>
            <p id="chatSubtitle"></p>
          </div>
          <div class="wx-chat-actions">
            <div class="ws-pill" id="wsStatus" data-state="off">
              <span class="ws-dot"></span>
              <span id="wsStatusText">离线</span>
            </div>
            <button type="button" class="icon-btn" id="btnLoadHistory" title="拉取历史">📜</button>
            <button type="button" class="icon-btn" id="btnMarkRead" title="标记已读">✓</button>
          </div>
        </header>

        <div class="wx-messages" id="messageScroll">
          <div class="wx-message-list" id="messageList">
            <div class="chat-placeholder">
              <p>登录并连接后即可聊天</p>
              <button type="button" class="btn primary" id="btnLoginPrompt">登录</button>
            </div>
          </div>
        </div>

        <footer class="wx-composer">
          <textarea id="content" rows="1" placeholder="输入消息，Enter 发送"></textarea>
          <button type="button" class="btn-send" id="btnSend" disabled>发送</button>
        </footer>
      </main>
    </div>

    <!-- 设置抽屉 -->
    <div class="drawer-backdrop hidden" id="drawerBackdrop"></div>
    <aside class="drawer hidden" id="drawer">
      <header class="drawer-head">
        <h2>设置</h2>
        <button type="button" class="icon-btn" id="btnCloseDrawer">×</button>
      </header>
      <nav class="drawer-tabs">
        <button type="button" class="drawer-tab active" data-drawer="login">登录</button>
        <button type="button" class="drawer-tab" data-drawer="config">连接</button>
        <button type="button" class="drawer-tab" data-drawer="group">群管理</button>
        <button type="button" class="drawer-tab" data-drawer="log">日志</button>
      </nav>

      <div class="drawer-body">
        <section class="drawer-pane active" data-pane="login">
          <label>user_id <input type="number" id="userId" value="1" min="1" /></label>
          <div class="btn-row">
            <button type="button" class="btn primary" id="btnDevToken">获取 Token 并连接</button>
          </div>
          <label>JWT <textarea id="token" rows="2" placeholder="dev-token"></textarea></label>
          <div class="btn-row">
            <button type="button" class="btn" id="btnWsConnect">连接 WS</button>
            <button type="button" class="btn" id="btnWsDisconnect" disabled>断开</button>
            <button type="button" class="btn ghost" id="btnPing">Ping</button>
          </div>
          <p class="hint">种子用户 1/2/3，群 <code>group_1</code>，私信 <code>c2c_1_2</code></p>
        </section>

        <section class="drawer-pane" data-pane="config" hidden>
          <label>User API <input type="text" id="userApi" /></label>
          <label>Gateway WS <input type="text" id="gatewayWs" /></label>
          <label>Conversation API <input type="text" id="convApi" /></label>
          <label>Message API <input type="text" id="msgApi" /></label>
          <label>Group API <input type="text" id="groupApi" /></label>
          <div class="btn-row">
            <button type="button" class="btn ghost" id="btnSaveConfig">保存</button>
            <button type="button" class="btn ghost" id="btnResetConfig">恢复默认</button>
          </div>
          <label>direct_days <input type="number" id="directDays" min="0" placeholder="空=全部" /></label>
        </section>

        <section class="drawer-pane" data-pane="group" hidden>
          <h3>建群</h3>
          <label>群名称 <input type="text" id="testGroupName" placeholder="调试群" /></label>
          <div class="btn-row">
            <button type="button" class="btn primary" id="btnCreateSoloGroup">创建空群</button>
            <button type="button" class="btn ghost" id="btnLoadSeedGroup">种子 group_1</button>
          </div>
          <div id="testGroupHistory" class="group-history"></div>
          <h3>拉人</h3>
          <div class="inline-fields">
            <label>group_id <input type="number" id="testGroupId" min="1" /></label>
            <label>conv_id <input type="text" id="testGroupConvId" placeholder="group_1" /></label>
          </div>
          <label>user_ids <input type="text" id="pullUserIds" placeholder="2, 3" /></label>
          <div class="inline-fields">
            <label>快捷 <input type="number" id="pullPresetUid" value="2" min="1" /></label>
            <button type="button" class="btn ghost" id="btnPullSelfOther">填入</button>
          </div>
          <div class="btn-row wrap">
            <button type="button" class="btn primary" id="btnAddMembers">拉人</button>
            <button type="button" class="btn" id="btnGetGroup">详情</button>
            <button type="button" class="btn" id="btnListGroupMembers">成员</button>
          </div>
          <p class="join-status" id="joinStatus" data-state="idle">—</p>
          <div class="btn-row wrap">
            <button type="button" class="btn" id="btnApplyGroupTargets">打开该群</button>
            <button type="button" class="btn" id="btnJoinRefreshConv">验证会话</button>
            <button type="button" class="btn" id="btnJoinCheckWs">检查 WS</button>
          </div>
        </section>

        <section class="drawer-pane log-pane" data-pane="log" hidden>
          <div class="log-toolbar">
            <label class="filter-check"><input type="checkbox" id="filterWs" checked /> WS</label>
            <label class="filter-check"><input type="checkbox" id="filterRest" checked /> REST</label>
            <label class="filter-check"><input type="checkbox" id="filterSys" checked /> 系统</label>
            <button type="button" class="btn ghost sm" id="btnClearLog">清空</button>
          </div>
          <ol class="log-list" id="logList"></ol>
        </section>
      </div>
    </aside>

    <!-- 兼容 group-test / 内部状态 -->
    <input type="hidden" id="convId" />
    <input type="hidden" id="groupId" value="1" />
    <input type="hidden" id="msgType" value="text" />
    <input type="hidden" id="clientMsgId" />
    <input type="hidden" id="readSeq" value="0" />
    <button type="button" id="btnListConv" hidden></button>
    <button type="button" id="btnListMsg" hidden></button>
    <button type="button" id="btnGenClientId" hidden></button>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
